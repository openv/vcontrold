name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DMANPAGES=OFF
          -DVSIM=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="--coverage -Wall -Wextra -Wpedantic -Werror"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Enforce coverage
        run: python3 tests/coverage.py build

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Configure
        run: >
          cmake -S . -B build
          -DMANPAGES=OFF
          -DVSIM=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libxml2-dev clang-tidy clang-tools cppcheck valgrind
      - name: Run static and dynamic analysis
        run: sh tools/run-quality.sh
